<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b3a"><title>Tiki Taco POS Completo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#25201c;font-family:system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dfd2c3;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950;color:#b52323;letter-spacing:1px}.tag{font-size:11px;color:#766c64}.live{font-size:11px;font-weight:900;color:#176b3a}
main{max-width:1250px;margin:auto;padding:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{border:0;border-radius:9px;padding:10px 14px;background:#fff;color:#625850;font-weight:850;white-space:nowrap}.tabs .on{background:#176b3a;color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}.card{background:#fff;border:1px solid #dfd2c3;border-radius:14px;padding:15px;box-shadow:0 3px 15px #0000000b}
h1{font-size:22px;margin:0 0 5px}h2{font-size:17px;margin:0 0 7px}h3{font-size:14px;margin:17px 0 7px}p{font-size:12px;color:#766c64}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.controls input,.controls select,.customer{width:100%;padding:10px;border:1px solid #d8cabc;border-radius:8px;background:#fff}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.cats button{border:1px solid #dfd2c3;background:#fffaf3;border-radius:18px;padding:8px 11px;font-size:11px;font-weight:800}.cats .on{background:#b52323;color:#fff;border-color:#b52323}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.prod{border:1px solid #dfd2c3;background:#fffdf9;border-radius:11px;padding:11px;text-align:left;min-height:105px}.ico{font-size:23px}.pn{display:block;font-size:12px;font-weight:900;line-height:1.25;margin:5px 0}.price{font-size:15px;color:#b52323;font-weight:950}.hint{display:block;font-size:9px;color:#888;margin-top:3px}
.order{position:sticky;top:70px;height:max-content}.orderhead{display:flex;justify-content:space-between}.badge{background:#f0e9df;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee6dc}.item b{font-size:12px}.item small{display:block;font-size:10px;color:#888;margin-top:3px}.mods{font-size:9px;color:#8b5d2c;line-height:1.35;margin-top:3px}.qty{white-space:nowrap}.qty button{width:27px;height:27px;border:1px solid #ddd0c3;background:#fff;border-radius:6px}.qty span{display:inline-block;width:22px;text-align:center;font-weight:900;font-size:12px}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:950;padding:13px 0}.total strong{color:#176b3a}.btn{width:100%;border:0;border-radius:9px;padding:12px;margin-top:7px;font-weight:900}.green{background:#176b3a;color:#fff}.gold{background:#d99a19;color:#20190d}.gray{background:#eee6dc}.red{background:#b52323;color:#fff}
.empty{text-align:center;padding:32px 8px;color:#8c827a;font-size:12px}.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.table{border:2px solid #b9d8c2;background:#eaf5ed;color:#176b3a;border-radius:12px;padding:20px 4px;font-weight:900}.table.busy{border-color:#e3aaa4;background:#fff0ef;color:#b52323}
.ticket{background:#fff;border:1px solid #dfd2c3;border-radius:12px;padding:13px;margin:9px 0}.tickettop{display:flex;justify-content:space-between}.state{font-size:10px;font-weight:900;background:#fff0cf;color:#755000;padding:5px 7px;border-radius:7px}.ticket ul{font-size:11px;margin:8px 0;padding-left:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#faf7f1;border:1px solid #dfd2c3;border-radius:10px;padding:12px}.stat b{display:block;color:#176b3a;font-size:19px}.stat span{font-size:10px;color:#777}
.modalbg{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.check{display:flex;align-items:center;gap:7px;border:1px solid #dfd2c3;border-radius:8px;padding:9px;font-size:11px;background:#fcfaf6}.check input{width:18px;height:18px}.modal textarea{width:100%;min-height:75px;border:1px solid #d8cabc;border-radius:8px;padding:10px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modal-actions button{border:0;border-radius:9px;padding:12px;font-weight:900}
@media(max-width:850px){.grid{grid-template-columns:1fr}.order{position:static}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.controls{grid-template-columns:1fr}.tables{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><div class="logo">TIKI TACO</div><div class="tag">Punto de venta</div></div><div class="live">● Caja abierta</div></header><main><nav id="tabs" class="tabs"></nav><div id="app"></div></main>
<script>
const MENU={
"Tacos":[["Tacos de Cochinita",4.75,"🌮"],["Tacos de Pollo al Aijillo",4.75,"🌮"],["Tacos de Birria",5.75,"🌮"],["Tacos de Camarón",5.75,"🌮"],["Tacos de Arrachera",6,"🌮"],["Tacos Dorados",6.5,"🌮"],["Tacos al Pastor",4.75,"🌮"]],
"Burritos":[["Burritos de Pollo al Aijillo",7.25,"🌯"],["Burritos de Pastor",7.25,"🌯"],["Burrito de Cochinita",7.25,"🌯"],["Burrito de Camarón",7.75,"🌯"],["Burrito Vegetariano",7.75,"🌯"],["Burrito de Birria",7.75,"🌯"],["Burrito de Chilaquil",8,"🌯"]],
"Tortas":[["Torta de Pastor",7.5,"🥪"],["Torta de Cochinita",7.5,"🥪"],["Torta de Pollo al Aijillo",7.5,"🥪"],["Torta de Birria",7.75,"🥪"],["Torta de Milanesa",7.75,"🥪"],["Torta Cubana",8.5,"🥪"],["Torta de Champiñones",7.75,"🥪"],["Torta de Berenjena",7.5,"🥪"]],
"Quesadillas":[["Quesadilla de Pastor",5.75,"🧀"],["Quesadilla de Pollo al Aijillo",5.75,"🧀"],["Quesadilla de Champiñones",6.25,"🧀"],["Quesadilla de Birria",6.25,"🧀"],["Quesadilla de Cochinita",6.25,"🧀"],["Quesadilla de Camarón",6.25,"🧀"],["Quesadilla Especial",7.5,"🧀"]],
"Nachos":[["Nachos con Guacamole",5.25,"🧀"],["Nachos con Frijoles",5.25,"🧀"],["Nachos con Queso",5.75,"🧀"],["Nachos Tiki Taco",7.75,"🧀"],["Nachos Vegetarianos",7.25,"🥑"],["Champi-queso",7,"🧀"],["Elotes",2.75,"🌽"],["Esquites",3,"🌽"]],
"Chilaquiles":[["Chilaquil en Salsa Verde",8.75,"🥘"],["Chilaquil en Salsa Roja",8.75,"🥘"],["Chilaquil Divorciado",9.5,"🥘"],["Enfrijoladas",8.75,"🥘"]],
"Enchiladas":[["Enchilada con Salsa Verde",8.75,"🥘"],["Enchilada con Salsa Roja",8.75,"🥘"],["Enchilada Suiza",9.5,"🥘"]],
"Tradicionales":[["Hamburguesa Regular",4.25,"🍔"],["Hamburguesa Especial",4.75,"🍔"],["Mexican Burguer",7.75,"🍔"],["Porción de papas",3,"🍟"],["Papi pollo",4,"🍗"],["Papas Tiki Taco",5.5,"🍟"],["Alitas 6 und y papas",6.75,"🍗"],["Alitas 10 und y papas",11,"🍗"]],
"Extras":[["Extra de Carne al Pastor (100g)",2.5,"➕"],["Extra de Carne de Cochinita (100g)",2.5,"➕"],["Extra de Pollo al Aijillo (100g)",2.5,"➕"],["Extra de Camarón (100g)",3,"➕"],["Extra de Milanesa de Res (100g)",3,"➕"],["Extra de Huevo Frito",1,"🍳"]],
"Bebidas Mexicanas":[["Cantarito",5.25,"🍹"],["Clamato o Michelada",5.25,"🍹"],["Coctel Margarita",5.25,"🍸"]],
"Bebidas Alcohólicas":[["Cerveza Club",2.5,"🍺"],["Cerveza Pilsener pequeña",2.5,"🍺"],["Cerveza Pilsener grande",4.75,"🍺"],["Cerveza Corona",3.5,"🍺"],["Cerveza Modelo",3.5,"🍺"],["Cusqueña Dark large",3.5,"🍺"],["Cusqueña Wheat beer",3.5,"🍺"]],
"Bebidas Frías":[["Coca Cola",1,"🥤"],["Fanta",1,"🥤"],["Sprite",1,"🥤"],["Fuze Tea",1,"🥤"],["Agua Dasani",1,"💧"],["Agua Dasani con gas",1,"💧"],["Agua de Jamaica",1.5,"🥤"],["Agua de Tamarindo",1.5,"🥤"]],
"Bebidas Calientes":[["Café Americano",1,"☕"],["Aguas Aromáticas",1,"☕"],["Capuchino",2.5,"☕"],["Mocachino",3,"☕"]]
};
const MODS=["Sin frijoles","Sin guacamole","Sin lechuga","Sin cebolla","Sin queso","Sin crema agria","Sin tomate","Sin aguacate","Sin piña","Sin jalapeños","Sin tocino","Sin mayonesa"];
let S={tab:"Pedido",cat:"Tacos",table:"Mesa 1",type:"Para consumir aquí",name:"",cart:[],orders:[],modal:null,payment:null};
try{S.orders=JSON.parse(localStorage.getItem("tt_complete_orders")||"[]")}catch(e){S.orders=[]}
const money=n=>"$"+Number(n).toFixed(2), save=()=>localStorage.setItem("tt_complete_orders",JSON.stringify(S.orders));
function total(){return S.cart.reduce((a,x)=>a+x.price*x.qty,0)+(S.type==="Para llevar +$0.50"?0.5:0)}
function render(){document.getElementById("tabs").innerHTML=["Pedido","Cocina","Mesas","Caja","Ventas"].map(x=>`<button class="${S.tab===x?"on":""}" data-tab="${x}">${x}</button>`).join("");document.getElementById("app").innerHTML=S.tab==="Pedido"?pedido():S.tab==="Cocina"?cocina():S.tab==="Mesas"?mesas():resumen(S.tab);modal()}
function pedido(){let a=MENU[S.cat];return `<div class="grid"><section class="card"><h1>Nuevo pedido</h1><div class="controls"><select id="table">${Array.from({length:12},(_,i)=>`<option ${S.table==="Mesa "+(i+1)?"selected":""}>Mesa ${i+1}</option>`).join("")}</select><select id="type"><option ${S.type==="Para consumir aquí"?"selected":""}>Para consumir aquí</option><option ${S.type==="Para llevar +$0.50"?"selected":""}>Para llevar +$0.50</option></select></div><div class="cats">${Object.keys(MENU).map(g=>`<button class="${g===S.cat?"on":""}" data-cat="${g}">${g}</button>`).join("")}</div><div class="products">${a.map((p,i)=>`<button class="prod" data-prod="${i}"><span class="ico">${p[2]}</span><span class="pn">${p[0]}</span><span class="price">${money(p[1])}</span><span class="hint">Personalizar</span></button>`).join("")}</div></section><aside class="card order"><div class="orderhead"><h2>Comanda</h2><span class="badge">${S.cart.reduce((a,x)=>a+x.qty,0)} uds.</span></div><input class="customer" id="customer" value="${S.name}" placeholder="Nombre del cliente (opcional)">${S.cart.length?S.cart.map(x=>`<div class="item"><div><b>${x.qty} × ${x.name}</b><small>${money(x.price)} c/u</small>${x.mods.length?`<div class="mods">${x.mods.join(" · ")}</div>`:""}${x.note?`<div class="mods">Nota: ${x.note}</div>`:""}</div><div class="qty"><button data-minus="${x.id}">−</button><span>${x.qty}</span><button data-plus="${x.id}">+</button></div></div>`).join(""):`<div class="empty">Agrega productos al pedido.</div>`}<div class="total"><span>Total</span><strong>${money(total())}</strong></div><button class="btn green" id="send" ${S.cart.length?"":"disabled"}>👨‍🍳 ENVIAR A COCINA</button><button class="btn gray" id="clear" ${S.cart.length?"":"disabled"}>Vaciar pedido</button></aside></div>`}
function cocina(){let a=S.orders.filter(o=>o.status!=="Cobrado");return `<section><h1>👨‍🍳 Cocina</h1><p>Pedidos en preparación y listos para cobrar.</p>${a.length?a.map(o=>`<article class="ticket"><div class="tickettop"><div><b>${o.table}</b>${o.name?" · "+o.name:""}<div class="muted">${o.type}</div></div><span class="state">${o.status}</span></div><ul>${o.items.map(x=>`<li><b>${x.qty} × ${x.name}</b>${x.mods.length?`<div class="mods">${x.mods.join(" · ")}</div>`:""}${x.note?`<div class="mods">Nota: ${x.note}</div>`:""}</li>`).join("")}</ul><b>${money(o.total)}</b>${o.status==="En cocina"?`<button class="btn green" data-ready="${o.id}">✓ PREPARADO</button>`:`<button class="btn gold" data-pay="${o.id}">💵 COBRAR</button>`}</article>`).join(""):`<div class="card empty">No hay pedidos en cocina.</div>`}</section>`}
function mesas(){return `<section class="card"><h1>Mesas</h1><div class="tables">${Array.from({length:12},(_,i)=>{let n="Mesa "+(i+1),b=S.orders.some(o=>o.table===n&&o.status!=="Cobrado");return `<button class="table ${b?"busy":""}" data-table="${n}">${n}<small style="display:block;font-size:9px">${b?"Ocupada":"Libre"}</small></button>`}).join("")}</div></section>`}
function resumen(w){let p=S.orders.filter(o=>o.status==="Cobrado"),sum=p.reduce((a,x)=>a+x.total,0),cash=p.filter(o=>o.payment==="Efectivo").reduce((a,x)=>a+x.total,0),card=p.filter(o=>o.payment==="Tarjeta").reduce((a,x)=>a+x.total,0),transfer=p.filter(o=>o.payment==="Transferencia").reduce((a,x)=>a+x.total,0);return `<section class="card"><h1>${w}</h1><div class="stats"><div class="stat"><b>${money(sum)}</b><span>Total cobrado</span></div><div class="stat"><b>${money(cash)}</b><span>Efectivo</span></div><div class="stat"><b>${money(card)}</b><span>Tarjeta</span></div><div class="stat"><b>${money(transfer)}</b><span>Transferencia</span></div></div><h3>Historial</h3>${S.orders.slice().reverse().map(o=>`<div class="item"><div><b>${o.table}</b><small>${o.status}${o.payment?" · "+o.payment:""}</small></div><b>${money(o.total)}</b></div>`).join("")||`<div class="empty">No hay ventas.</div>`}</section>`}
function modal(){if(!S.modal)return;document.body.insertAdjacentHTML("beforeend",`<div class="modalbg" id="mb"><div class="modal"><h2>Personalizar</h2><p><b>${S.modal.name}</b> · ${money(S.modal.price)}</p><p><b>Marca lo que el cliente NO quiere:</b></p><div class="checks">${MODS.map((m,i)=>`<label class="check"><input type="checkbox" data-m="${i}">${m}</label>`).join("")}</div><textarea id="note" placeholder="Nota para cocina"></textarea><div class="modal-actions"><button class="modal-cancel" id="mc">Cancelar</button><button class="modal-ok green" id="ma">✓ AGREGAR AL PEDIDO</button></div></div></div>`);document.getElementById("mc").onclick=()=>{S.modal=null;render()};document.getElementById("ma").onclick=()=>{let mods=[...document.querySelectorAll("[data-m]:checked")].map(x=>MODS[+x.dataset.m]);S.cart.push({id:String(Date.now())+Math.random(),name:S.modal.name,price:S.modal.price,qty:1,mods,note:document.getElementById("note").value.trim()});S.modal=null;render()}}
document.addEventListener("click",e=>{let t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;render();return}let c=e.target.closest("[data-cat]");if(c){S.cat=c.dataset.cat;render();return}let p=e.target.closest("[data-prod]");if(p){let x=MENU[S.cat][+p.dataset.prod];S.modal={name:x[0],price:x[1]};render();return}let mi=e.target.closest("[data-minus]");if(mi){let x=S.cart.find(a=>a.id===mi.dataset.minus);if(x){x.qty--;if(x.qty<1)S.cart=S.cart.filter(a=>a.id!==x.id);render()}return}let pl=e.target.closest("[data-plus]");if(pl){let x=S.cart.find(a=>a.id===pl.dataset.plus);if(x){x.qty++;render()}return}let rd=e.target.closest("[data-ready]");if(rd){let o=S.orders.find(a=>a.id===rd.dataset.ready);if(o){o.status="Preparado";save();render()}return}let py=e.target.closest("[data-pay]");if(py){S.paymentOrder=py.dataset.pay;showPay();return}let tb=e.target.closest("[data-table]");if(tb){S.table=tb.dataset.table;S.tab="Pedido";render();return}if(e.target.id==="send"){S.name=document.getElementById("customer").value;let o={id:"TT"+Date.now(),table:S.table,name:S.name,type:S.type,total:total(),items:JSON.parse(JSON.stringify(S.cart)),status:"En cocina",createdAt:new Date().toISOString()};S.orders.push(o);save();S.cart=[];S.name="";S.tab="Cocina";render();alert("✓ Pedido enviado a cocina");return}if(e.target.id==="clear"){S.cart=[];render();return}});
document.addEventListener("change",e=>{if(e.target.id==="table"){S.table=e.target.value}if(e.target.id==="type"){S.type=e.target.value}});
function showPay(){let o=S.orders.find(a=>a.id===S.paymentOrder);if(!o)return;document.body.insertAdjacentHTML("beforeend",`<div class="modalbg" id="paybg"><div class="modal"><h2>💵 Cobrar pedido</h2><p>${o.table} · Total <b>${money(o.total)}</b></p><select id="pm" style="width:100%;padding:11px;border:1px solid #d8cabc;border-radius:8px"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select><div id="cashbox" style="margin-top:8px"><input id="cash" type="number" step="0.01" placeholder="Efectivo recibido" style="width:100%;padding:11px;border:1px solid #d8cabc;border-radius:8px"><p id="change">Cambio: $0.00</p></div><div class="modal-actions"><button class="modal-cancel" id="pc">Cancelar</button><button class="modal-ok green" id="okpay">✓ CONFIRMAR COBRO</button></div></div></div>`);const pm=document.getElementById("pm"),cash=document.getElementById("cash"),change=document.getElementById("change"),box=document.getElementById("cashbox");pm.onchange=()=>{box.style.display=pm.value==="Efectivo"?"block":"none"};cash.oninput=()=>{change.textContent="Cambio: "+money(Math.max(0,(+cash.value||0)-o.total))};document.getElementById("pc").onclick=()=>document.getElementById("paybg").remove();document.getElementById("okpay").onclick=()=>{if(pm.value==="Efectivo"&&(+cash.value||0)<o.total){alert("El efectivo recibido es menor al total.");return}o.status="Cobrado";o.payment=pm.value;o.paidAt=new Date().toISOString();save();document.getElementById("paybg").remove();render();alert("✓ Venta registrada")}}
render();
</script></body></html>
